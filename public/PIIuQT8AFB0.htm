  <script type="text/javascript">
    (function () {
      if (window.screen.width) {
        var isInFullscreen = false;

        var setViewport = {
          config: {
            min: 640,

            profile: "width={deviceWidth}, maximum-scale=5, user-scalable=yes",
            minProfile: "width=device-width, initial-scale=1, maximun-scale=1,user-scalable=no",

            // 新增, 基准布局宽度, 不要小于最小布局宽度
            baseWidth: 1366
          },
          //widthDevice: window.screen.width,
          setMeta: function (forceFullscreen=false) {
            // console.log(window.orientation)
            var deviceWidth = window.screen.width;
            var params = this.config.minProfile;
            var head = document.getElementsByTagName("head")[0];
            var viewport = document.createElement('meta');
            var metaList = head.getElementsByTagName("meta");
            if (window.orientation !== undefined) {
              deviceWidth = window.orientation == 0 || window.orientation == -180 || window.orientation == 180 ? window.screen.width : window.screen.height
            }
            for (var i = 0; i < metaList.length; ++i) {
              if (metaList[i].name == "viewport") {
                metaList[i].remove();
                break;
              }
            }
            //console.log(window.screen.width,window.screen.height)
            // 如果是全屏，强制用 device-width
            if (forceFullscreen === true) {
              params = "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
            }
            else if (deviceWidth >= this.config.min && deviceWidth < this.config.max) {
              // params = this.config.profile.replace("{deviceWidth}", deviceWidth);

              // 改动: 当设备宽度小于 baseWidth 时, 用 width=baseWidth 并按比例缩放
              var base = this.config.baseWidth;
              var scale = deviceWidth / base;
              params =
                "width=" + base +
                ", initial-scale=" + scale +
                ", minimum-scale=" + scale +
                ", maximum-scale=5" +
                ", user-scalable=yes" +
                ", viewport-fit=cover";
            }
            if (deviceWidth >= this.config.max) {
              params = this.config.maxProfile
            }
            viewport.setAttribute("name", "viewport");
            viewport.setAttribute("content", params);
            head.appendChild(viewport)
          }
        }
        // 监听播放器全屏切换
        function onFullscreenChange() {
          var nowFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
        
          if (nowFullscreen === isInFullscreen) return;

          isInFullscreen = nowFullscreen;

          // 延迟到完成全屏布局后再改 viewport
          // 两层requestAnimationFrame的作用是在iPad上消抖
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              setViewport.setMeta(isInFullscreen);
            });
          });
        }

        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("webkitfullscreenchange", onFullscreenChange);

        window.addEventListener("orientationchange", () => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              setViewport.setMeta(isInFullscreen);
            });
          });
        }, false);
        setViewport.setMeta(false)
      }
    })()
